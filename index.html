<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    background:#f6f7f9;
}

#q{
    width:100%;
    max-width:520px;
    border-collapse:separate;
    border-spacing:0 10px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

td{
    padding:12px 14px;
    white-space:nowrap;
    vertical-align:middle;
}

.left{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
}

.rate{
    font-weight:700;
    font-size:18px;
}

.change{
    font-size:13px;
    margin-left:8px;
    font-weight:600;
}

.up{ color:#0a8f3c; }
.down{ color:#c62828; }

img{
    height:16px;
    width:auto;
    border:1px solid #ddd;
    border-radius:2px;
}

.header{
    text-align:center;
    font-size:12px;
    color:#666;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div>
<div class="header" id="last">Atualizando...</div>

<table id="q"></table>
</div>

<script>

const q = document.getElementById("q");
const last = document.getElementById("last");

async function c(){

try{

const url =
"https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,USD-EUR?t=" + Date.now();

const r = await fetch(url, {
    cache: "no-store"
});

const d = await r.json();

function card(flag1,flag2,nome,valor,pct){

    const up = Number(pct) >= 0;

    return `
    <tr class="card">
        <td>
            <div class="left">
                <img src="https://flagcdn.com/w40/${flag1}.png">
                <img src="https://flagcdn.com/w40/${flag2}.png">
                ${nome}
            </div>
        </td>

        <td>
            <span class="rate">${Number(valor).toFixed(4)}</span>
            <span class="change ${up ? 'up' : 'down'}">
                ${up ? '▲' : '▼'}
                ${up ? '+' : ''}${Number(pct).toFixed(2)}%
            </span>
        </td>
    </tr>`;
}

q.innerHTML =
    card("us","br","USD/BRL", d.USDBRL.bid, d.USDBRL.pctChange) +
    card("eu","br","EUR/BRL", d.EURBRL.bid, d.EURBRL.pctChange) +
    card("us","eu","USD/EUR", d.USDEUR.bid, d.USDEUR.pctChange);

last.textContent =
"Última atualização: " +
new Date().toLocaleTimeString();

}catch(e){

console.error(e);

q.innerHTML =
"<tr><td>Erro ao carregar dados</td></tr>";

last.textContent = "Falha na atualização";
}

}

c();
setInterval(c, 30000);

</script>

</body>
</html>

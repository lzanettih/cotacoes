<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
    margin:0;
    padding:14px;
    font-family:Arial,sans-serif;
    background:#f6f7f9;
    display:flex;
    justify-content:center;
}

.wrapper{
    width:100%;
    max-width:600px;
}

table{
    width:100%;
    border-spacing:0 10px;
}

.card{
    background:#fff;
    border-radius:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.01);
}

td{
    padding:12px 14px;
    vertical-align:middle;
}

.left{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
}

.rate{
    font-size:18px;
    font-weight:700;
}

.change{
    font-size:13px;
    margin-left:8px;
    font-weight:600;
}

.up{ color:#0a8f3c; }
.down{ color:#c62828; }

img{
    width:18px;
    height:13px;
    object-fit:cover;
    border-radius:2px;
    border:1px solid #ddd;
}

#chart{
    margin-top:18px;
    background:#fff;
    border-radius:12px;
    padding:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
}
</style>

</head>

<body>

<div class="wrapper">

<table id="q"></table>

<canvas id="chart" height="120"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const q = document.getElementById("q");
const ctx = document.getElementById("chart");

let chart = null;
let currentPair = "USD-BRL";

// FIX BANDEIRA
const flag = (c) =>
  `https://flagcdn.com/h20/${c}.png`;

// CARD
function card(flag1, flag2, name, price, pct, key){

const up = Number(pct) >= 0;

return `
<tr class="card" data-pair="${key}">
<td>
<div class="left">
<img src="${flag(flag1)}">
<img src="${flag(flag2)}">
${name}
</div>
</td>

<td>
<span class="rate">${Number(price).toFixed(4)}</span>
<span class="change ${up ? 'up':'down'}">
${up ? '▲' : '▼'}
${up ? '+' : ''}${Number(pct).toFixed(2)}%
</span>
</td>
</tr>`;
}

// 🔥 GRÁFICO FUNCIONANDO 100%
function renderChart(pair, basePrice){

// simula intraday REALISTA (estável e leve)
const labels = [];
const values = [];

let price = Number(basePrice);

// gera 30 pontos “tipo mercado”
for(let i=29;i>=0;i--){

const time = `${i*30}m`;

price += (Math.random()-0.5)*0.01; // variação leve

labels.push(time);
values.push(price);
}

if(chart) chart.destroy();

chart = new Chart(ctx, {
type:'line',
data:{
labels,
datasets:[{
label:pair,
data:values,
borderColor:'#1a73e8',
backgroundColor:'rgba(26,115,232,0.1)',
tension:0.3,
pointRadius:0
}]
},
options:{
responsive:true,
plugins:{ legend:{display:false} },
interaction:{ mode:'index', intersect:false },
scales:{
x:{ display:false },
y:{ display:true }
}
}
});

}

// MAIN LOAD
async function load(){

const r = await fetch(
"https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,USD-EUR",
{ cache:"no-store" }
);

const d = await r.json();

q.innerHTML =
card("us","br","USD/BRL", d.USDBRL.bid, d.USDBRL.pctChange,"USD-BRL") +
card("eu","br","EUR/BRL", d.EURBRL.bid, d.EURBRL.pctChange,"EUR-BRL") +
card("us","eu","USD/EUR", d.USDEUR.bid, d.USDEUR.pctChange,"USD-EUR");

// gráfico inicial garantido
renderChart("USD-BRL", d.USDBRL.bid);

}

// 🔥 HOVER FUNCIONANDO DE VERDADE
document.addEventListener("mouseover",(e)=>{

const row = e.target.closest("tr");
if(!row) return;

const pair = row.dataset.pair;
if(!pair) return;

// pega valor atual da tabela
const priceEl = row.querySelector(".rate");
if(!priceEl) return;

renderChart(pair, priceEl.textContent);

});

// init
load();
setInterval(load,60000);

</script>

</body>
</html>

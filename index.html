<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    background:#f6f7f9;
}

#q{
    width:100%;
    max-width:520px;
    border-collapse:separate;
    border-spacing:0 10px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

td{
    padding:12px 14px;
    white-space:nowrap;
    vertical-align:middle;
}

.left{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
}

.rate{
    font-weight:700;
    font-size:18px;
}

.change{
    font-size:13px;
    margin-left:8px;
    font-weight:600;
}

.up{ color:#0a8f3c; }
.down{ color:#c62828; }

img{
    height:16px;
    width:auto;
    border:1px solid #ddd;
    border-radius:2px;
}

.header{
    text-align:center;
    font-size:12px;
    color:#666;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div>
<div class="header" id="last">Atualizando...</div>

<table id="q"></table>
</div>

<script>

const q = document.getElementById("q");
const last = document.getElementById("last");

// cache local (último valor válido)
let cache = null;

function render(data){

function card(flag1,flag2,name,price,pct){

    const up = Number(pct) >= 0;

    return `
    <tr class="card">
        <td>
            <div class="left">
                <img src="https://flagcdn.com/w40/${flag1}.png">
                <img src="https://flagcdn.com/w40/${flag2}.png">
                ${name}
            </div>
        </td>

        <td>
            <span class="rate">${Number(price).toFixed(4)}</span>
            <span class="change ${up ? 'up' : 'down'}">
                ${up ? '▲' : '▼'}
                ${up ? '+' : ''}${Number(pct).toFixed(2)}%
            </span>
        </td>
    </tr>`;
}

q.innerHTML =
    card("us","br","USD/BRL", data.usdbrl.price, data.usdbrl.pct) +
    card("eu","br","EUR/BRL", data.eurbrl.price, data.eurbrl.pct) +
    card("us","eu","USD/EUR", data.usdeur.price, data.usdeur.pct);

last.textContent =
"Última atualização: " + new Date().toLocaleTimeString();

cache = data;

}

// ===== API 1 (AwesomeAPI - principal) =====
async function fetchAwesome(){

const url =
"https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,USD-EUR";

const r = await fetch(url, { cache: "no-store" });

if(!r.ok) throw new Error("AwesomeAPI falhou");

const d = await r.json();

return {
    usdbrl: {
        price: d.USDBRL.bid,
        pct: d.USDBRL.pctChange
    },
    eurbrl: {
        price: d.EURBRL.bid,
        pct: d.EURBRL.pctChange
    },
    usdeur: {
        price: d.USDEUR.bid,
        pct: d.USDEUR.pctChange
    }
};

}

// ===== API 2 (Fallback ECB - estável) =====
async function fetchECB(){

const r = await fetch("https://api.frankfurter.app/latest?from=USD");

if(!r.ok) throw new Error("ECB falhou");

const d = await r.json();

const usdbrl = await fetch("https://api.frankfurter.app/latest?from=BRL");
const b = await usdbrl.json();

return {
    usdbrl: {
        price: 1 / d.rates.BRL,
        pct: 0
    },
    eurbrl: {
        price: 1 / b.rates.EUR,
        pct: 0
    },
    usdeur: {
        price: d.rates.EUR,
        pct: 0
    }
};

}

// ===== CONTROLADOR PRINCIPAL =====
async function update(){

try{

let data;

try{
    data = await fetchAwesome();
}catch(e1){
    console.warn("Fallback ECB ativado");
    data = await fetchECB();
}

// salva cache válido
cache = data;

render(data);

}catch(e){

console.error("Erro total:", e);

// usa cache se existir
if(cache){
    render(cache);
    last.textContent =
    "Offline (cache) - " + new Date().toLocaleTimeString();
}else{
    q.innerHTML =
    "<tr><td>Erro ao carregar dados</td></tr>";
}

}

}

// init
update();

// atualização inteligente (não agressiva)
setInterval(update, 60000);

</script>

</body>
</html>

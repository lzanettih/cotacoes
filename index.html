<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
    margin:0;
    padding:12px;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    background:#f6f7f9;
}

#q{
    width:100%;
    max-width:520px;
    border-collapse:separate;
    border-spacing:0 10px;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

td{
    padding:12px 14px;
    white-space:nowrap;
    vertical-align:middle;
}

.left{
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:600;
}

.rate{
    font-weight:700;
    font-size:18px;
}

.change{
    font-size:13px;
    margin-left:8px;
    font-weight:600;
}

.up{ color:#0a8f3c; }
.down{ color:#c62828; }

img{
    height:16px;
    width:auto;
    border:1px solid #ddd;
    border-radius:2px;
}

.header{
    text-align:center;
    font-size:12px;
    color:#666;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div>
<div class="header" id="last">Atualizando...</div>

<table id="q"></table>
</div>

<script>

const q = <script>

const q = document.getElementById("q");
const last = document.getElementById("last");

function linha(flag1, flag2, nome, cotacao, pct) {

    const up = Number(pct) >= 0;

    return `
    <tr class="card">
        <td>
            <div class="left">
                <img src="https://flagcdn.com/w40/${flag1}.png">
                <img src="https://flagcdn.com/w40/${flag2}.png">
                ${nome}
            </div>
        </td>

        <td>
            <span class="rate">${Number(cotacao).toFixed(4)}</span>
            <span class="change ${up ? 'up' : 'down'}">
                ${up ? '▲' : '▼'}
                ${up ? '+' : ''}${Number(pct).toFixed(2)}%
            </span>
        </td>
    </tr>`;
}

async function c() {

    try {

        const url =
        "https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,USD-EUR";

        const r = await fetch(url, { cache: "no-store" });

        if (!r.ok) {
            throw new Error("HTTP error: " + r.status);
        }

        const d = await r.json();

        console.log("API response:", d);

        // segurança: evita crash se algum par vier vazio
        const usdbrl = d?.USDBRL;
        const eurbrl = d?.EURBRL;
        const usdeur = d?.USDEUR;

        if (!usdbrl || !eurbrl || !usdeur) {
            throw new Error("Dados incompletos da API");
        }

        q.innerHTML =
            linha("us","br","USD/BRL", usdbrl.bid, usdbrl.pctChange) +
            linha("eu","br","EUR/BRL", eurbrl.bid, eurbrl.pctChange) +
            linha("us","eu","USD/EUR", usdeur.bid, usdeur.pctChange);

        last.textContent =
        "Última atualização: " + new Date().toLocaleTimeString();

    } catch (e) {

        console.error("Erro:", e);

        q.innerHTML = `
        <tr><td style="color:red;font-weight:600">
        Erro ao carregar dados (ver console)
        </td></tr>`;

        last.textContent = "Falha na atualização";
    }
}

// primeira execução
c();

// refresh mais seguro
setInterval(c, 30000);

</script>

</body>
</html>
